<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Savebot admin</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { color-scheme:light dark; --bg:var(--tg-theme-bg-color,#f4f6f8); --card:var(--tg-theme-secondary-bg-color,#fff); --fg:var(--tg-theme-text-color,#17202a); --muted:var(--tg-theme-hint-color,#6b7280); --accent:var(--tg-theme-button-color,#2481cc); }
    * { box-sizing:border-box; }
    body { margin:0; padding:18px 14px calc(24px + env(safe-area-inset-bottom)); background:var(--bg); color:var(--fg); font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:4px 2px 16px; }
    h1 { margin:0; font-size:21px; } h2 { margin:18px 2px 10px; font-size:17px; }
    button { border:0; border-radius:11px; background:var(--accent); color:#fff; padding:10px 14px; font:inherit; font-weight:600; }
    button.secondary { background:var(--card); color:var(--fg); }
    .stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:18px; }
    .card,.user,.download { border-radius:14px; background:var(--card); padding:14px; }
    .label,.meta { color:var(--muted); font-size:13px; } .number { margin-top:4px; font-size:24px; font-weight:700; }
    #users { display:grid; gap:8px; }
    .user { width:100%; text-align:left; color:var(--fg); cursor:pointer; }
    .user-line { display:flex; justify-content:space-between; gap:12px; align-items:center; }
    .name { font-weight:700; overflow-wrap:anywhere; } .meta { margin-top:4px; }
    .badge { flex:none; border-radius:20px; padding:4px 9px; background:var(--bg); font-size:12px; }
    #history { display:grid; gap:10px; }
    .toolbar { display:flex; gap:8px; align-items:center; margin-bottom:12px; }
    .download-title { display:flex; justify-content:space-between; gap:10px; align-items:center; font-weight:650; }
    .source-link { margin-top:8px; font-size:13px; overflow-wrap:anywhere; }
    .source-link a { color:var(--accent); }
    .media { display:grid; gap:9px; margin-top:10px; }
    video,.photo { display:block; width:100%; max-height:65vh; border-radius:10px; background:#000; }
    .photo { object-fit:contain; }
    .empty,.error { padding:18px 12px; text-align:center; color:var(--muted); }
    .error { color:#c0392b; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <header><h1>📊 Admin panel</h1><button id="refresh">Yangilash</button></header>
  <section class="stats">
    <div class="card"><div class="label">Foydalanuvchilar</div><div class="number" id="total-users">—</div></div>
    <div class="card"><div class="label">Jami yuklashlar</div><div class="number" id="total-downloads">—</div></div>
    <div class="card"><div class="label">Bugungi faollar</div><div class="number" id="today-active">—</div></div>
  </section>
  <section id="user-view">
    <h2>Barcha foydalanuvchilar</h2>
    <main id="users"><div class="empty">Ma’lumot yuklanmoqda…</div></main>
  </section>
  <section id="history-view" hidden>
    <div class="toolbar"><button class="secondary" id="back">← Orqaga</button><strong id="selected-user"></strong></div>
    <h2>Yuklab olgan videolari va rasmlari</h2>
    <main id="history"></main>
  </section>
  <script>
    const tg = window.Telegram?.WebApp;
    tg?.ready(); tg?.expand();
    const initData = tg?.initData || '';
    const headers = {'X-Telegram-Init-Data': initData};
    const usersBox = document.getElementById('users');
    const historyBox = document.getElementById('history');
    const nameOf = user => user.full_name || (user.username ? '@' + user.username : String(user.user_id));
    function text(parent, tag, value, className) {
      const node = document.createElement(tag); node.textContent = value;
      if (className) node.className = className;
      parent.appendChild(node); return node;
    }
    async function request(path) {
      const response = await fetch(path, {headers, cache:'no-store'});
      if (!response.ok) throw new Error(response.status === 403 ? 'Bu bo‘lim faqat admin uchun.' : 'Mini App’ni Telegram ichida qayta oching.');
      return response;
    }
    async function loadUsers() {
      const response = await request('/api/dashboard');
      const data = await response.json();
      document.getElementById('total-users').textContent = data.total_users;
      document.getElementById('total-downloads').textContent = data.total_downloads;
      document.getElementById('today-active').textContent = data.today_active || 0;
      usersBox.replaceChildren();
      if (!data.users.length) { text(usersBox,'div','Foydalanuvchilar hali yo‘q.','empty'); return; }
      for (const user of data.users) {
        const button = document.createElement('button'); button.className = 'user';
        const line = document.createElement('div'); line.className = 'user-line';
        text(line,'span',nameOf(user),'name');
        text(line,'span',String(user.download_count) + ' ta','badge');
        button.appendChild(line);
        const handle = user.username ? '@' + user.username + ' · ' : '';
        text(button,'div',handle + 'ID ' + user.user_id,'meta');
        button.addEventListener('click', () => openUser(user));
        usersBox.appendChild(button);
      }
    }
    async function loadAsset(asset, parent) {
      const holder = document.createElement('div');
      if (!asset.available) { text(holder,'div','Bu eski media fayli arxivlanmagan yoki saqlash muddati tugagan.','meta'); parent.appendChild(holder); return; }
      text(holder,'div',asset.name,'meta');
      const button = text(holder,'button',asset.type === 'photo' ? 'Rasmni ko‘rish' : 'Videoni ko‘rish','secondary');
      button.addEventListener('click', async () => {
        button.disabled = true; button.textContent = 'Yuklanmoqda…';
        try {
          const response = await request('/api/media/' + asset.id);
          const url = URL.createObjectURL(await response.blob());
          if (asset.type === 'photo') {
            const image = document.createElement('img'); image.className = 'photo'; image.alt = asset.name; image.src = url; holder.replaceChildren(image);
          } else {
            const video = document.createElement('video'); video.className = 'media-player'; video.controls = true; video.playsInline = true; video.preload = 'none'; video.src = url; holder.replaceChildren(video);
          }
        } catch (error) { button.disabled = false; button.textContent = error.message; }
      });
      parent.appendChild(holder);
    }
    async function openUser(user) {
      document.getElementById('user-view').hidden = true;
      document.getElementById('history-view').hidden = false;
      document.getElementById('selected-user').textContent = nameOf(user);
      historyBox.replaceChildren(); text(historyBox,'div','Yuklanmoqda…','empty');
      try {
        const response = await request('/api/users/' + user.user_id + '/downloads');
        const data = await response.json(); historyBox.replaceChildren();
        if (!data.downloads.length) { text(historyBox,'div','Bu foydalanuvchi hali hech narsa yuklamagan.','empty'); return; }
        for (const item of data.downloads) {
          const card = document.createElement('article'); card.className = 'download';
          const top = document.createElement('div'); top.className = 'download-title';
          text(top,'span',item.platform + ' · ' + item.timestamp,'');
          text(top,'span',({downloading:'Yuklanmoqda',completed:'Tugadi',failed:'Xato'}[item.status] || item.status),'badge');
          card.appendChild(top);
          if (item.source_url) {
            const source = document.createElement('div'); source.className = 'source-link';
            text(source,'strong','Manba havolasi: ','');
            let validSource = false;
            try {
              const parsed = new URL(item.source_url);
              validSource = (parsed.protocol === 'https:' || parsed.protocol === 'http:') &&
                (parsed.hostname === 'instagram.com' || parsed.hostname.endsWith('.instagram.com') ||
                 parsed.hostname === 'tiktok.com' || parsed.hostname.endsWith('.tiktok.com'));
            } catch (_) {}
            if (validSource) {
              const link = document.createElement('a'); link.href = item.source_url;
              link.textContent = item.source_url; link.target = '_blank';
              link.rel = 'noopener noreferrer'; source.appendChild(link);
            } else {
              text(source,'span',item.source_url,'');
            }
            card.appendChild(source);
          }
          const media = document.createElement('div'); media.className = 'media';
          if (!item.media.length) text(media,'div','Bu eski yuklash uchun video arxivlanmagan.','meta');
          for (const asset of item.media) await loadAsset(asset, media);
          card.appendChild(media); historyBox.appendChild(card);
        }
      } catch (error) { historyBox.replaceChildren(); text(historyBox,'div',error.message,'error'); }
    }
    document.getElementById('refresh').addEventListener('click', () => loadUsers().catch(error => { usersBox.replaceChildren(); text(usersBox,'div',error.message,'error'); }));
    document.getElementById('back').addEventListener('click', () => { document.getElementById('history-view').hidden = true; document.getElementById('user-view').hidden = false; });
    loadUsers().catch(error => { usersBox.replaceChildren(); text(usersBox,'div',error.message,'error'); });
  </script>
</body>
</html>
